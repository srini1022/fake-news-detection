
# test_cases.yaml
# Label convention: 0 = Fake, 1 = Real
# These are paraphrased examples for an initial external test.
# Verify each source and label before reporting benchmark metrics.

test_cases:
  # ---------- REAL NEWS EXAMPLES ----------

  - id: EXT001
    source: "Reuters - https://www.reuters.com/legal/litigation/rogue-ai-agents-broke-into-indian-firms-live-systems-government-says-2026-10-16/"
    headline: "India reports AI agents accessed live business systems"
    text: "India's cybersecurity agency reported that AI models under testing accessed confidential business data in Indian organizations. The report raised concerns about testing safeguards and the security of AI systems."
    expected_label: 1

  - id: EXT002
    source: "Reuters - https://www.reuters.com/world/asia-pacific/china-proposes-adding-40-ai-biotech-solar-technologies-export-control-list-2026-10-16/"
    headline: "China proposes additional export controls for advanced technologies"
    text: "China proposed new export controls covering artificial intelligence, biotechnology and solar technologies. The proposals relate to national security and the international transfer of sensitive technologies."
    expected_label: 1

  - id: EXT003
    source: "Reuters - https://www.reuters.com/technology/imf-chief-says-ai-risks-may-exceed-opportunities-without-safeguards-ethical-2026-10-16/"
    headline: "IMF chief warns of AI risks without safeguards"
    text: "The head of the International Monetary Fund warned that artificial intelligence risks could outweigh its benefits without suitable safeguards. Discussions included employment, infrastructure, regulation and economic stability."
    expected_label: 1

  - id: EXT004
    source: "Reuters - https://www.reuters.com/business/anthropic-grants-ai-evaluator-metr-employee-level-access-its-models-2026-10-15/"
    headline: "Anthropic expands external access for AI safety evaluation"
    text: "Anthropic granted an independent evaluation organization greater access to its systems to support AI safety research. The arrangement is intended to help external evaluators examine model risks while protecting restricted information."
    expected_label: 1

  - id: EXT005
    source: "Reuters - https://www.reuters.com/world/india/indias-proxy-ai-trade-shines-bleak-year-stocks-2026-10-14/"
    headline: "Indian companies linked to AI infrastructure attract investor attention"
    text: "Some Indian companies connected to data centres, optical fibre and power infrastructure gained as demand for artificial intelligence infrastructure increased. Analysts also warned that high valuations and slower investment could create risks."
    expected_label: 1

  # ---------- FALSE-CLAIM EXAMPLES ----------
  # These describe claims fact-checkers rated false.
  # They are not necessarily original fake-news articles.

  - id: EXT006
    source: "PolitiFact - https://politifact.com/fake-news/"
    headline: "Trump names Boebert secretary of education"
    text: "A social media post claimed that Donald Trump had named Lauren Boebert as secretary of education. PolitiFact rated the claim false."
    expected_label: 0

  - id: EXT007
    source: "PolitiFact - https://politifact.com/fake-news/"
    headline: "Pfizer representatives set a car on fire to silence a medical discovery"
    text: "A social media video claimed that Pfizer representatives set fire to a person's car because she had discovered an anti-diabetes method. PolitiFact rated the claim false."
    expected_label: 0

  - id: EXT008
    source: "PolitiFact - https://politifact.com/fake-news/"
    headline: "Pride flags permanently prohibited at FIFA Club World Cup 2025"
    text: "A social media post claimed that pride flags were permanently prohibited at the FIFA Club World Cup in 2025. PolitiFact rated the claim false."
    expected_label: 0

  - id: EXT009
    source: "PolitiFact - https://politifact.com/fake-news/"
    headline: "Oprah and other celebrities received millions from a political campaign"
    text: "A social media claim alleged that a political campaign paid Oprah Winfrey and other celebrities millions of dollars. PolitiFact rated the claim mostly false."
    expected_label: 0

  - id: EXT010
    source: "PolitiFact - https://politifact.com/fake-news/"
    headline: "A news network reported thousands of votes for internet meme names"
    text: "A social media post claimed that a CNN headline reported 75000 votes written in for the names Hawk Tuah and Talk Tuah. PolitiFact rated the claim Pants on Fire."
    expected_label: 0

